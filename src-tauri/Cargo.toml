[package]
name = "tmall-sku-worker"
version = "0.1.12"
description = "Local Tmall SKU rebuild desktop worker"
authors = ["Local Operations"]
edition = "2021"

[lib]
name = "tmall_sku_worker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
